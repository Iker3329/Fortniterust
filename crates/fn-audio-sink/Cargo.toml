[package]
name = "fn-audio-sink"
version.workspace = true
edition.workspace = true
description = "AudioSink / SoundEvent seam of fn-app implemented on fn-audio (cpal output, recovered Athena cues, Settings volume buses)"

[features]
default = ["device"]
# cpal (WASAPI) output; without it only the headless `EngineSink::with_engine` constructor exists.
device = ["fn-audio/device-output"]

[dependencies]
fn-audio = { path = "../fn-audio" }
glam.workspace = true

[lints.rust]
unsafe_code = "forbid"
