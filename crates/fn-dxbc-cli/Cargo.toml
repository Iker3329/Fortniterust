[package]
name = "fn-dxbc-cli"
version.workspace = true
edition.workspace = true
description = "CLI: disassemble / evaluate / translate DXBC shaders and extract them from a Fortnite 1.8 install (replaces the Node + PowerShell shader tooling)"

[lib]
name = "fn_dxbc_cli"
path = "src/lib.rs"

[[bin]]
name = "fn-dxbc"
path = "src/main.rs"

[dependencies]
fn-dxbc = { path = "../fn-dxbc" }
fn-pak = { path = "../fn-pak" }
fn-uasset = { path = "../fn-uasset" }
miniz_oxide = "0.8"
rayon = "1"
serde_json = "1"
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

[dev-dependencies]
fn-testdata = { path = "../fn-testdata" }
naga = { version = "30", default-features = false, features = ["wgsl-in", "wgsl-out"] }
wgpu = { workspace = true }
pollster = { workspace = true }

[lints.rust]
unsafe_code = "forbid"




