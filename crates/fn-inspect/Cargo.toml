[package]
name = "fn-inspect"
version.workspace = true
edition.workspace = true
description = "CLI for inspecting Fortnite pak installs and packages"

[[bin]]
name = "fn-inspect"
path = "src/main.rs"

[dependencies]
fn-pak = { path = "../fn-pak" }
fn-uasset = { path = "../fn-uasset" }
serde_json = "1"
rayon = "1"
