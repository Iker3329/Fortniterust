[package]
name = "fn-web-smoke"
version = "0.1.0"
edition = "2021"
publish = false
description = "Smoke test of the browser platform layer (threads from main / workers, scope on main, ranged pak reads, clocks across threads, WebGPU clear): tools/web/build.sh --smoke"

# its own workspace: built only for wasm32 by tools/web/build.sh, never by the native workspace
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
fn-web-rt = { path = "../fn-web-rt" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }

[profile.release]
opt-level = 2
panic = "abort"
